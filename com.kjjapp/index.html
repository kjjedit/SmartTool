<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SmartTool</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <button id="addTriggerBtn" class="round-btn add-round-btn" title="Add" style="display:none;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <div class="header-buttons">
                <button id="settingsBtn" class="round-btn settings-round-btn" title="Settings">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button id="editBtn" class="round-btn edit-round-btn" title="Edit">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="panel-container">
            <div id="grid" class="grid-container"></div>
        </div>

        <div id="addButtons" class="add-menu-container">
            <div class="add-menu-handle"></div>
            <div class="add-menu-header">Add an item</div>
            <div class="add-list">
                <div class="add-list-item" id="addShortcut">
                    <div class="item-icon icon-purple"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                    <div class="item-label">Shortcut</div>
                </div>
                <div class="add-list-item" id="addGraph">
                    <div class="item-icon icon-blue"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></div>
                    <div class="item-label">Curve Editor</div>
                </div>
                <div class="add-list-item" id="addAnchor">
                    <div class="item-icon icon-red"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="1" x2="12" y2="9"></line><line x1="12" y1="15" x2="12" y2="23"></line><line x1="1" y1="12" x2="9" y2="12"></line><line x1="15" y1="12" x2="23" y2="12"></line></svg></div>
                    <div class="item-label">Anchor Point</div>
                </div>
                <div class="add-list-item" id="addTrends">
                    <div class="item-icon icon-orange"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg></div>
                    <div class="item-label">Trending Sounds</div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./lib/CSInterface.js"></script>
    <script type="text/javascript" src="./js/main.js"></script>
</body>
</html>
