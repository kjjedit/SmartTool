<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SmartTool</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="header-buttons">
                <button id="editBtn" class="round-btn edit-round-btn" title="Modifier">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
                <button id="settingsBtn" class="round-btn settings-round-btn" title="Réglages">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6m5.196-15.804L13.464 6.93m-2.828 2.829l-3.732-3.733M23 12h-6m-6 0H1m15.804 5.196-3.733-3.732m-2.829-2.828l-3.733 3.732"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="panel-container">
            <div id="grid" class="grid-container">
            </div>
        </div>

        <div id="addButtons" class="add-buttons" style="display: none;">
            <div class="add-label">Add an item :</div>
            <div class="button-row">
                <button id="addShortcut" class="add-btn shortcut-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Shortcut
                </button>
                <button id="addGraph" class="add-btn graph-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Curve
                </button>
            </div>
            <div class="button-row" style="margin-top: 8px;">
                <button id="addAnchor" class="add-btn anchor-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <line x1="12" y1="1" x2="12" y2="9"></line>
                        <line x1="12" y1="15" x2="12" y2="23"></line>
                        <line x1="1" y1="12" x2="9" y2="12"></line>
                        <line x1="15" y1="12" x2="23" y2="12"></line>
                    </svg>
                    Anchorpoint
                </button>
                <button id="addAlign" class="add-btn align-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                        <line x1="15" y1="3" x2="15" y2="21"></line>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="3" y1="15" x2="21" y2="15"></line>
                    </svg>
                    Align
                </button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="./lib/CSInterface.js"></script>
    <script type="text/javascript" src="./js/main.js"></script>
</body>
</html>
